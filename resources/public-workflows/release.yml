# Public distribution workflow: native analysis is built and tested privately.
# Package only the reviewed binaries committed with prebuilt/manifest.json.
name: SoundPrep ReaPack release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this commit to this PUBLIC repository after all checks pass
        type: boolean
        default: false
      download_repository:
        description: Public owner/repository for candidate asset URLs (blank uses this repository)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: reapack-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/windows.yml
  package:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed prebuilt helper versions and hashes
        run: python tools/prebuilt_helpers.py
      - name: Check release target
        env:
          PUBLISH: ${{ inputs.publish }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
          CURRENT_REPOSITORY: ${{ github.repository }}
          DOWNLOAD_REPOSITORY: ${{ inputs.download_repository }}
        run: |
          python - <<'PY'
          import os
          if os.environ["PUBLISH"] == "true":
              if os.environ["PRIVATE_REPOSITORY"] != "false":
                  raise SystemExit("Public releases must be built in the public distribution repository.")
              target = os.environ["DOWNLOAD_REPOSITORY"]
              if target and target != os.environ["CURRENT_REPOSITORY"]:
                  raise SystemExit("Publishing URLs must point to this repository.")
          PY
      - name: Read package version
        id: version
        run: |
          python - <<'PY'
          import datetime, os, pathlib, re, subprocess
          text = pathlib.Path("SoundPrep.lua").read_text()
          version = re.search(r"^-- @version (\d+\.\d+\.\d+)$", text, re.M)[1]
          epoch = int(subprocess.check_output(["git", "show", "-s", "--format=%ct", "HEAD"], text=True))
          release_time = datetime.datetime.fromtimestamp(epoch, datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tag=v{version}\n")
              out.write(f"release_time={release_time}\n")
          PY
      - name: Check existing release and tag
        id: release_state
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: &check_release_state |
          mkdir -p build
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > build/releases.json
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          tag = os.environ["RELEASE_TAG"]
          releases = [r for page in json.loads(pathlib.Path("build/releases.json").read_text()) for r in page]
          matches = [r for r in releases if r["tag_name"] == tag]
          if any(not r["draft"] for r in matches):
              raise SystemExit(f"{tag} is already published. Use a new version to preserve published files.")
          if len(matches) > 1:
              raise SystemExit(f"Multiple drafts match {tag}. Resolve the ambiguous release before publishing.")

          source = os.environ.get("SOURCE_COMMIT") or subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True).strip()
          ref = f"refs/tags/{tag}"
          peeled = ref + "^{}"
          output = subprocess.check_output(["git", "ls-remote", "--tags", "origin", ref, peeled], text=True)
          refs = {name: sha for sha, name in (line.split() for line in output.splitlines())}
          tag_commit = refs.get(peeled, refs.get(ref))
          if tag_commit and tag_commit != source:
              raise SystemExit(f"{tag} points to {tag_commit}, expected {source}.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tag_exists={str(tag_commit is not None).lower()}\n")
              out.write(f"draft_id={matches[0]['id'] if matches else ''}\n")
          PY
      - name: Load previous public index
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/previous
          python - <<'PY'
          import json, os, pathlib, subprocess
          releases = [r for page in json.loads(pathlib.Path("build/releases.json").read_text()) for r in page]
          published = [r for r in releases if not r["draft"] and not r["prerelease"]]
          if published:
              latest = json.loads(subprocess.check_output(
                  ["gh", "api", "repos/" + os.environ["GITHUB_REPOSITORY"] + "/releases/latest"], text=True))
              if not any(a["name"] == "index.xml" for a in latest["assets"]):
                  raise SystemExit("Previous release has no ReaPack index; review the migration manually.")
              subprocess.run(["gh", "release", "download", latest["tag_name"],
                              "--pattern", "index.xml", "--dir", "build/previous"], check=True)
          PY
      - name: Package runtime, binaries and ReaPack index
        env:
          DOWNLOAD_REPOSITORY: ${{ inputs.download_repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TIME: ${{ steps.version.outputs.release_time }}
        run: |
          : "${RELEASE_TIME:?Missing release timestamp}"
          args=()
          if [ -f build/previous/index.xml ]; then
            args+=(--previous-index build/previous/index.xml)
          fi
          python tools/package_release.py \
            --output build/release \
            --repository "${DOWNLOAD_REPOSITORY:-$GITHUB_REPOSITORY}" \
            --tag "$RELEASE_TAG" \
            --release-time "$RELEASE_TIME" \
            --macos-helper prebuilt/reaper_audition_macro.dylib \
            --windows-helper prebuilt/reaper_audition_macro.dll \
            "${args[@]}"
          cd build/release
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: soundprep-release
          path: build/release/*
          if-no-files-found: error
          overwrite: true
  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: soundprep-release
          path: build/release
      - name: Recheck existing release and tag
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: *check_release_state
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
          TAG_EXISTS: ${{ steps.release_state.outputs.tag_exists }}
          DRAFT_ID: ${{ steps.release_state.outputs.draft_id }}
        run: |
          cd build/release
          sha256sum --check SHA256SUMS
          cd ../..
          if [ "$TAG_EXISTS" = false ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_COMMIT" --silent
          fi

          checked_draft() {
            local id
            id=$(gh release view "$RELEASE_TAG" --json databaseId,isDraft --jq 'select(.isDraft) | .databaseId') || return 1
            if [ -z "$id" ] || [ "$id" != "${DRAFT_ID:-$id}" ]; then
              echo "Expected draft for $RELEASE_TAG is no longer available." >&2
              return 1
            fi
            echo "$id"
          }

          if [ -n "$DRAFT_ID" ]; then
            checked_draft > /dev/null
            gh release upload "$RELEASE_TAG" build/release/* --clobber
          else
            gh release create "$RELEASE_TAG" build/release/* \
              --verify-tag \
              --title "SoundPrep ${RELEASE_TAG#v}" \
              --notes-file "docs/releases/${RELEASE_TAG#v}.md" \
              --draft
          fi
          draft=$(checked_draft)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$draft" \
            -F draft=false -F prerelease=false -f make_latest=true --silent
